name: check

on:
  push:
  pull_request:

jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: every printed output is a real run
        run: python3 tools/check_outputs.py

      - name: no broken relative links
        run: python3 tools/check_links.py
